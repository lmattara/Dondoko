<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Evolution Animation Test</title>
<style>
  body{ margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:14px; }
  button{ font-size:16px; padding:12px 20px; border-radius:8px; border:none; background:#2ecc71; cursor:pointer; }
</style>
</head>
<body>
  <h1>Evolution Animation Test</h1>
  <button id="runBtn">Charmander &rarr; Charmeleon</button>
  <script src="evolution.js"></script>
  <script>
    document.getElementById('runBtn').addEventListener('click', () => {
      playEvolutionAnimation({
        spriteAtualUrl: 'pixel_pack/front-default/charmander.png',
        spriteNovoUrl: 'pixel_pack/front-default/charmeleon.png',
        nomeDoMonstro: 'Charmander',
        tipoDoMonstro: 'fire',
        onComplete: () => console.log('evolution complete')
      });
    });
  </script>
</body>
</html>

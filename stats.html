<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Stats - Rinne</title>
<link rel="icon" type="image/png" href="assets/website/favicon.png">
<link rel="stylesheet" href="style.css?v=202608042402">
<style>
  .stats-page{ width:100%; max-width:640px; text-align:left; }
  .stats-header-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  .stats-top-actions{ display:flex; gap:8px; }
  .stats-back{ display:inline-block; margin-top:24px; }

  .stats-section-title{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--text-faint); text-transform:uppercase; margin-bottom:10px; margin-top:28px; }
  .stats-section-title-podium{ font-size:13px; text-transform:uppercase; }

  /* "Community lifetime stats" reads as an actual page heading (bold,
     title-style font) instead of the small uppercase-mono label the other
     (sub)section titles use. */
  .stats-title-heading{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:var(--text); margin-bottom:14px; }

  .stats-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .stats-card{ border-radius:12px; padding:16px; text-align:center; }
  .stats-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px; }
  .stats-value{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; color:var(--lime); }

  .stats-grid-4{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .stats-grid-4 .stats-card{ padding:12px 6px; }
  .stats-grid-4 .stats-value{ font-size:18px; }

  .stats-mode-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .stats-mode-grid .stats-value{ font-size:22px; }

  /* Podium: sprite anchor points are positioned by percentage over the
     baked-in 768x768 artwork, so they scale together as the podium resizes.
     Each sprite is a fixed-size square that clips its own background, so the
     walk-cycle animation stepping through frames can never draw outside it. */
  .stats-podium{ position:relative; width:100%; max-width:380px; margin:10px auto 0; aspect-ratio:1/1; }
  .stats-podium-bg{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  /* The hover target: fixed-size square, positioned by %, no overflow-hidden
     of its own so the tooltip (a child, anchored above it) isn't clipped. */
  .stats-podium-sprite{ position:absolute; width:60px; height:60px; transform:translate(-50%, 0); }
  /* The animated part: same box, but this is the one that clips — the
     walk-cycle stepping through frames can never draw outside it. */
  .stats-podium-sprite-frame{
    width:100%; height:100%; overflow:hidden;
    background-repeat:no-repeat; background-size:256px 256px; background-position:0 0;
    image-rendering:pixelated;
    animation: stats-podium-walk .8s steps(4) infinite;
  }
  @keyframes stats-podium-walk{ from{ background-position:0 0; } to{ background-position:-256px 0; } }

  /* Hover-only mini-dex card, same pattern as .pick-tooltip elsewhere in the
     game — name/types/gen/pick-rate only show up on hover so the podium art
     stays uncluttered by default. */
  .stats-podium-tooltip{
    display:none; position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:8px;
    width:140px; background:rgba(8,12,10,0.98); border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    text-align:center; z-index:20; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .stats-podium-sprite:hover .stats-podium-tooltip{ display:block; }
  .stats-podium-tooltip-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; color:var(--text); text-transform:capitalize; }
  .stats-podium-tooltip-types{ margin:6px 0; }
  .stats-podium-tooltip-meta{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--text-faint); letter-spacing:.02em; }

  /* Full page width now that Runs by mode no longer shares a row with it. */
  .rank-dist-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
  .rank-dist-label{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); width:100px; flex-shrink:0; }
  .rank-dist-bar-track{ flex:1; height:10px; border-radius:6px; background:var(--bg-raised); border:1px solid var(--line); overflow:hidden; }
  .rank-dist-bar-fill{ height:100%; background:var(--lime); border-radius:6px; }
  .rank-dist-count{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--lime); width:32px; text-align:right; flex-shrink:0; }

  .stats-empty{ color:var(--text-dim); font-size:14px; }
  .stats-loading{ color:var(--text-dim); font-size:14px; text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="stats-page">
  <div class="stats-header-row">
    <a class="pokestop-home-link" href="index.html" title="Back to Home">
      <img src="assets/website/Rinnelogo.png" alt="Rinne home" draggable="false" oncontextmenu="return false;">
    </a>
    <div class="stats-top-actions">
      <a class="btn-ghost report-bug-home-link" href="https://discord.gg/dqrGzCFetm" target="_blank" rel="noopener" style="margin-top:0;">Discord</a>
      <a class="btn-ghost faq-link" href="faq.html" style="margin-top:0;">FAQ</a>
    </div>
  </div>

  <div id="statsContent"><div class="stats-loading">Loading community stats...</div></div>

  <a class="stats-back btn-ghost" href="index.html" style="width:auto; display:inline-block; padding:10px 16px;">BACK</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://azhhuhzbfuyuuwtykegm.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6aGh1aHpiZnV5dXV3dHlrZWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1OTc2NTMsImV4cCI6MjEwMDE3MzY1M30._WMBHrCEDRUmKAZORzIUHdm1isjQRrc_ZOH4gMfTA7M";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MODE_LABELS = { classic:'Classic', pro:'Pro', nuzlocke:'Nuzlocke' };
  // Mirrors profile.html's lifetimeExp()/trainerRankTitle() exactly, so a
  // player's tier here always matches what they see on their own profile.
  // Fully transparent and score-based — see faq.html's Ranks section.
  const RANK_TIERS = ['Rookie', 'Ace', 'Veteran', 'Elite', 'Champion', 'Professor'];
  const RANK_EXP_THRESHOLDS = { ace:10000, veteran:30000, elite:50000, champion:150000, professor:500000 };

  function lifetimeExp(runs){
    return (runs || []).reduce((sum, r) => sum + (r.score || 0), 0);
  }
  function trainerRankTitle(runs){
    const exp = lifetimeExp(runs);
    const championRuns = (runs || []).filter(r => r.details && r.details.champion).length;
    if(exp >= RANK_EXP_THRESHOLDS.professor && championRuns >= 20) return 'Professor';
    if(exp >= RANK_EXP_THRESHOLDS.champion && championRuns >= 10) return 'Champion';
    if(exp >= RANK_EXP_THRESHOLDS.elite && championRuns >= 3) return 'Elite';
    if(exp >= RANK_EXP_THRESHOLDS.veteran && championRuns >= 1) return 'Veteran';
    if(exp >= RANK_EXP_THRESHOLDS.ace) return 'Ace';
    return 'Rookie';
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function capitalize(name){
    return String(name).split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  // Same sheet/index game.js uses for type-badge.html — duplicated here
  // since stats.html doesn't load game.js.
  const TYPE_ICON_INDEX = {
    normal:0, fighting:1, flying:2, poison:3, ground:4, rock:5, bug:6, ghost:7, steel:8,
    fire:10, water:11, grass:12, electric:13, psychic:14, ice:15, dragon:16, dark:17, fairy:18,
  };
  function typeBadgeHTML(type){
    const idx = TYPE_ICON_INDEX[type];
    if(idx == null) return '';
    return `<span class="type-badge type-badge-sm" style="background-position-y:-${idx * 12}px" title="${type}"></span>`;
  }

  // Mirrors STARTERS in game.js: 3 starters per generation, in order.
  const PODIUM_STARTER_GENS = [
    'bulbasaur','charmander','squirtle',
    'chikorita','cyndaquil','totodile',
    'treecko','torchic','mudkip',
    'turtwig','chimchar','piplup',
    'snivy','tepig','oshawott',
    'chespin','fennekin','froakie',
    'rowlet','litten','popplio',
    'grookey','scorbunny','sobble',
    'sprigatito','fuecoco','quaxly',
  ].reduce((map, name, i) => { map[name] = Math.floor(i / 3) + 1; return map; }, {});

  // Every distinct value's count, most-picked first — mostFrequent() (the
  // starter card used to only need the single winner) is now just this
  // list's first entry.
  function topFrequent(values, n){
    const counts = new Map();
    values.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
    return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
  }

  // Walks data/evolutions.json backward from any species to the first stage
  // of its line (e.g. swampert -> marshtomp -> mudkip), so "Most Picked
  // Starter" always reads as the starter you actually chose even for runs
  // saved before starterSpeciesAtPick existed (whose only record is the
  // run's final, possibly-evolved snapshot).
  async function loadEvolutionBaseMap(){
    const evolutions = await fetch('data/evolutions.json').then(r => r.json()).catch(() => ({}));
    const parentOf = {};
    Object.entries(evolutions).forEach(([from, to]) => {
      (Array.isArray(to) ? to : [to]).forEach(t => { parentOf[t] = from; });
    });
    return parentOf;
  }
  function baseSpeciesOf(name, parentOf){
    let cur = name;
    const seen = new Set();
    while(parentOf[cur] && !seen.has(cur)){ seen.add(cur); cur = parentOf[cur]; }
    return cur;
  }

  async function loadStats(){
    const content = document.getElementById('statsContent');
    try{
      await loadStatsInner(content);
    }catch(e){
      content.innerHTML = '<p class="stats-empty">Couldn\'t load community stats. Try refreshing.</p>';
      console.error(e);
    }
  }

  async function loadStatsInner(content){
    // Plain counts stay server-side (COUNT queries, no rows pulled down).
    // Only the per-species/per-starter breakdowns need the actual `details`
    // JSON, since there's no simple column to aggregate that server-side —
    // fine at today's leaderboard size, may need a proper DB view/RPC if
    // this table ever grows into the tens of thousands of rows.
    const [
      { count: totalPlayers },
      { count: totalRuns },
      { count: totalChampions },
      { data: modeRows },
      { data: detailRows },
      evolutionParentOf,
      pokemonList,
    ] = await Promise.all([
      supabaseClient.from('profiles').select('user_id', { count:'exact', head:true }),
      supabaseClient.from('scores').select('id', { count:'exact', head:true }),
      supabaseClient.from('scores').select('id', { count:'exact', head:true }).eq('details->>champion', 'true'),
      supabaseClient.from('scores').select('mode'),
      supabaseClient.from('scores').select('user_id, score, caught_count, details'),
      loadEvolutionBaseMap(),
      fetch('data/pokemon.json').then(r => r.json()).catch(() => []),
    ]);
    const typesOf = Object.fromEntries((pokemonList || []).map(p => [p.name, p.types || []]));

    const runs = detailRows || [];
    if(!runs.length){
      content.innerHTML = '<p class="stats-empty">No runs recorded yet.</p>';
      return;
    }

    const totalCaught = runs.reduce((sum, r) => sum + (r.caught_count || 0), 0);
    const starterNames = [];
    runs.forEach(r => {
      const details = r.details || {};
      // starterSpeciesAtPick records the species at the moment it was
      // actually picked, unaffected by it evolving later this run — older
      // runs saved before this existed fall back to `starter` (the run's
      // final, possibly-evolved snapshot).
      const starterName = details.starterSpeciesAtPick || details.starter?.name;
      if(starterName) starterNames.push(baseSpeciesOf(starterName, evolutionParentOf));
    });
    const topStarters = topFrequent(starterNames, 3);

    const byMode = { classic:0, pro:0, nuzlocke:0 };
    (modeRows || []).forEach(r => { if(byMode[r.mode] !== undefined) byMode[r.mode]++; });

    // Only counts accounts with at least one signed-in run recorded — guest
    // runs (user_id null) have no persistent identity to group by, and an
    // account that's never played while signed in isn't represented here
    // (same reason "Rookie" — 0 runs — never actually shows up below).
    const runsByPlayer = {};
    runs.forEach(r => {
      if(!r.user_id) return;
      (runsByPlayer[r.user_id] = runsByPlayer[r.user_id] || []).push(r);
    });
    const rankCounts = Object.fromEntries(RANK_TIERS.map(t => [t, 0]));
    Object.values(runsByPlayer).forEach(playerRuns => {
      rankCounts[trainerRankTitle(playerRuns)]++;
    });
    const rankedPlayers = Object.keys(runsByPlayer).length;

    const overallCards = [
      ['Registered Players', totalPlayers ?? 0],
      ['Total Runs', totalRuns ?? 0],
      ['Champions Crowned', totalChampions ?? 0],
      ['Pokémon Caught', totalCaught],
    ].map(([label, value]) => `
      <div class="stats-card">
        <div class="stats-label">${label}</div>
        <div class="stats-value">${value}</div>
      </div>
    `).join('');

    // Podium spots, keyed by finishing rank (1st/2nd/3rd), positioned as
    // percentages over the 1024x850 podium artwork: 1st sits center on the
    // tall block, 2nd left, 3rd right, feet resting on each block's top edge.
    const PODIUM_SPOTS = [
      { left: '48%', bottom: '36%' },
      { left: '26%', bottom: '31%' },
      { left: '70%', bottom: '26%' },
    ];
    const podiumSprites = topStarters.map(([name, count], i) => {
      const spot = PODIUM_SPOTS[i];
      const pct = starterNames.length ? Math.round((count / starterNames.length) * 100) : 0;
      const gen = PODIUM_STARTER_GENS[name];
      // 1st place stands out slightly larger than the other two.
      const size = i === 0 ? 60.6 : 60;
      return `
        <div class="stats-podium-sprite" style="left:${spot.left}; bottom:${spot.bottom}; width:${size}px; height:${size}px;">
          <div class="stats-podium-sprite-frame" style="background-image:url('assets/pokemon-game-assets/Graphics/Characters/Followers/${name.toUpperCase()}.png')"></div>
          <div class="stats-podium-tooltip">
            <div class="stats-podium-tooltip-name">${capitalize(name)}</div>
            <div class="stats-podium-tooltip-types">${(typesOf[name] || []).map(typeBadgeHTML).join('')}</div>
            <div class="stats-podium-tooltip-meta">${gen ? `Gen ${gen} · ` : ''}${pct}% of runs</div>
          </div>
        </div>
      `;
    }).join('');
    const starterPodium = topStarters.length ? `
      <div class="stats-podium">
        <img class="stats-podium-bg" src="assets/ui/Podium.png" alt="Podium">
        ${podiumSprites}
      </div>
    ` : `<p class="stats-empty">No runs yet.</p>`;

    const modeCards = Object.keys(MODE_LABELS).map(mode => `
      <div class="stats-card">
        <div class="stats-label">${MODE_LABELS[mode]}</div>
        <div class="stats-value">${byMode[mode]}</div>
      </div>
    `).join('');

    const rankRows = RANK_TIERS.map(tier => {
      const count = rankCounts[tier];
      const pct = rankedPlayers ? Math.round((count / rankedPlayers) * 100) : 0;
      return `
        <div class="rank-dist-row">
          <div class="rank-dist-label">${escapeHTML(tier)}</div>
          <div class="rank-dist-bar-track"><div class="rank-dist-bar-fill" style="width:${pct}%"></div></div>
          <div class="rank-dist-count">${count}</div>
        </div>
      `;
    }).join('');

    content.innerHTML = `
      <div class="stats-title-heading">Community lifetime stats</div>
      <div class="stats-grid-4">${overallCards}</div>
      <div class="stats-section-title" style="margin-top:20px;">Runs by mode</div>
      <div class="stats-mode-grid">${modeCards}</div>
      <div class="stats-section-title stats-section-title-podium">Most picked starters</div>
      ${starterPodium}
      <div class="stats-section-title">Players by rank (${rankedPlayers})</div>
      ${rankedPlayers ? rankRows : '<p class="stats-empty">No signed-in runs yet.</p>'}
    `;
  }

  loadStats();
</script>
</body>
</html>
